<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>InternIO Certificate Verification</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #17213c;
    }

    /* HEADER */

    header {
      background: #14213d;
      color: white;
      text-align: center;
      padding: 38px 20px;
    }

    .logo {
      font-size: 36px;
      font-weight: 700;
      letter-spacing: -1px;
    }

    .logo span {
      color: #d4af37;
    }

    .tagline {
      margin-top: 8px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 1.5px;
      color: #e5e7eb;
    }

    /* MAIN */

    .container {
      width: 100%;
      max-width: 700px;
      margin: 55px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      text-align: center;
      margin-top: 0;
      margin-bottom: 15px;
      font-size: 32px;
    }

    .description {
      text-align: center;
      color: #666;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    /* INPUT */

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #14213d;
    }

    /* BUTTON */

    button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: none;
      border-radius: 7px;
      background: #14213d;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #1d2d50;
    }

    /* RESULT */

    .result {
      margin-top: 30px;
    }

    .verified {
      text-align: center;
      color: #16803c;
      font-size: 23px;
      font-weight: 700;
      margin-bottom: 25px;
    }

    .not-found {
      text-align: center;
      color: #c62828;
      font-size: 20px;
      font-weight: 700;
      padding: 20px;
    }

    /* DETAILS */

    .details {
      border-top: 1px solid #e5e7eb;
      margin-top: 10px;
    }

    .detail {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 15px 0;
      border-bottom: 1px solid #eeeeee;
    }

    .label {
      color: #777;
      font-weight: 500;
    }

    .value {
      color: #17213c;
      font-weight: 600;
      text-align: right;
    }

    .valid {
      color: #16803c;
    }

    /* CERTIFICATE BUTTON */

    .certificate-button {
      display: block;
      width: 100%;
      text-align: center;
      margin-top: 25px;
      padding: 15px;
      background: #d4af37;
      color: #14213d;
      text-decoration: none;
      border-radius: 7px;
      font-weight: 700;
    }

    .certificate-button:hover {
      background: #c49f2f;
    }

    /* FOOTER */

    footer {
      text-align: center;
      color: #777;
      font-size: 13px;
      padding: 20px;
      margin-bottom: 20px;
    }

    /* MOBILE */

    @media (max-width: 600px) {

      header {
        padding: 30px 15px;
      }

      .logo {
        font-size: 30px;
      }

      .container {
        margin: 25px auto;
        padding: 15px;
      }

      .card {
        padding: 25px 20px;
      }

      h1 {
        font-size: 27px;
      }

      .detail {
        flex-direction: column;
        gap: 5px;
      }

      .value {
        text-align: left;
      }

    }

  </style>

</head>


<body>


  <!-- HEADER -->

  <header>

    <div class="logo">
      Intern<span>IO</span>
    </div>

    <div class="tagline">
      INNOVATION &amp; OPPORTUNITIES
    </div>

  </header>


  <!-- MAIN -->

  <div class="container">

    <div class="card">

      <h1>
        Certificate Verification
      </h1>

      <p class="description">
        Verify the authenticity of an internship
        certificate issued by InternIO.
      </p>


      <!-- CERTIFICATE INPUT -->

      <input
        id="certificateId"
        type="text"
        placeholder="Enter Certificate ID"
        autocomplete="off"
      >


      <button
        onclick="verifyCertificate()"
      >
        Verify Certificate
      </button>


      <!-- RESULT -->

      <div
        id="result"
        class="result"
      ></div>

    </div>

  </div>


  <!-- FOOTER -->

  <footer>
    © 2026 InternIO — Innovation &amp; Opportunities
  </footer>



  <script>


    /*
    =====================================================
    INTERNIO CERTIFICATE DATABASE
    =====================================================

    FOR NOW WE ARE TESTING ONE CERTIFICATE.

    Later we will connect this to your certificate
    database so you don't have to manually add students.
    */


    const certificates = {


      "INIO-2026-000001": {

        certificateId:
          "INIO-2026-000001",

        studentName:
          "Test Student",

        internship:
          "Web Development",

        project:
          "E-Commerce Website",

        startDate:
          "01 Aug 2026",

        endDate:
          "08 Aug 2026",

        duration:
          "1 Week",

        issueDate:
          "10 Aug 2026",

        status:
          "VALID",


        /*
        =================================================
        IMPORTANT

        REPLACE THE TEXT BELOW WITH YOUR GOOGLE DRIVE
        CERTIFICATE PDF LINK.
        =================================================
        */

        certificateUrl:
          "https://drive.google.com/file/d/1mN5aLQk_hNu2gfxVOsNh6u1AQL2NGr9M/view?usp=sharing"

      }

    };



    /*
    =====================================================
    VERIFY CERTIFICATE
    =====================================================
    */

    function verifyCertificate() {


      const input =
        document.getElementById(
          "certificateId"
        );


      const result =
        document.getElementById(
          "result"
        );


      /*
      Get entered certificate ID
      */

      const id =
        input.value
          .trim()
          .replace(/^["']|["']$/g, "")
          .toUpperCase();


      /*
      Empty input
      */

      if (!id) {

        result.innerHTML = `

          <div class="not-found">

            Please enter a Certificate ID.

          </div>

        `;

        return;

      }


      /*
      Search certificate
      */

      const certificate =
        certificates[id];


      /*
      Certificate not found
      */

      if (!certificate) {

        result.innerHTML = `

          <div class="not-found">

            ✕ Certificate Not Found

          </div>

        `;

        return;

      }


      /*
      Certificate found
      */

      result.innerHTML = `


        <div class="verified">

          ✓ CERTIFICATE VERIFIED

        </div>


        <div class="details">


          <div class="detail">

            <span class="label">
              Certificate ID
            </span>

            <span class="value">
              ${escapeHTML(
                certificate.certificateId
              )}
            </span>

          </div>


          <div class="detail">

            <span class="label">
              Student Name
            </span>

            <span class="value">
              ${escapeHTML(
                certificate.studentName
              )}
            </span>

          </div>


          <div class="detail">

            <span class="label">
              Internship
            </span>

            <span class="value">
              ${escapeHTML(
                certificate.internship
              )}
            </span>

          </div>


          <div class="detail">

            <span class="label">
              Project
            </span>

            <span class="value">
              ${escapeHTML(
                certificate.project
              )}
            </span>

          </div>


          <div class="detail">

            <span class="label">
              Start Date
            </span>

            <span class="value">
              ${escapeHTML(
                certificate.startDate
              )}
            </span>

          </div>


          <div class="detail">

            <span class="label">
              End Date
            </span>

            <span class="value">
              ${escapeHTML(
                certificate.endDate
              )}
            </span>

          </div>


          <div class="detail">

            <span class="label">
              Duration
            </span>

            <span class="value">
              ${escapeHTML(
                certificate.duration
              )}
            </span>

          </div>


          <div class="detail">

            <span class="label">
              Issue Date
            </span>

            <span class="value">
              ${escapeHTML(
                certificate.issueDate
              )}
            </span>

          </div>


          <div class="detail">

            <span class="label">
              Status
            </span>

            <span class="value valid">
              ✓ ${escapeHTML(
                certificate.status
              )}
            </span>

          </div>


        </div>


        ${
          certificate.certificateUrl &&
          certificate.certificateUrl !==
          "PASTE_YOUR_GOOGLE_DRIVE_PDF_LINK_HERE"

          ?

          `

          <a
            class="certificate-button"
            href="${certificate.certificateUrl}"
            target="_blank"
            rel="noopener noreferrer"
          >

            VIEW CERTIFICATE

          </a>

          `

          :

          `

          <p
            style="
              text-align:center;
              color:#777;
              margin-top:25px;
            "
          >

            Certificate PDF link not added yet.

          </p>

          `
        }


      `;

    }



    /*
    =====================================================
    SECURITY HELPER
    =====================================================
    */

    function escapeHTML(value) {

      return String(value)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }



    /*
    =====================================================
    AUTOMATIC VERIFICATION

    If someone opens:

    ?id=INIO-2026-000001

    the certificate automatically verifies.
    =====================================================
    */

    window.onload = function() {


      const params =
        new URLSearchParams(
          window.location.search
        );


      const id =
        params.get("id");


      if (id) {


        document
          .getElementById(
            "certificateId"
          )
          .value = id;


        verifyCertificate();

      }

    };


  </script>


</body>

</html>
