<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>InternIO Certificate Verification</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #17213c;
    }

    header {
      background: #14213d;
      color: white;
      text-align: center;
      padding: 35px 20px;
    }

    .logo {
      font-size: 34px;
      font-weight: bold;
    }

    .logo span {
      color: #d4af37;
    }

    .tagline {
      margin-top: 6px;
      font-size: 14px;
      letter-spacing: 1px;
    }

    .container {
      max-width: 650px;
      margin: 50px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 5px 25px rgba(0,0,0,.08);
    }

    h1 {
      text-align: center;
    }

    p {
      color: #666;
      line-height: 1.6;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      margin-top: 20px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 6px;
      background: #14213d;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .result {
      margin-top: 30px;
    }

    .verified {
      color: #16803c;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }

    .not-found {
      color: #c62828;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    .details {
      margin-top: 25px;
      border-top: 1px solid #ddd;
    }

    .detail {
      display: flex;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid #eee;
      gap: 20px;
    }

    .label {
      color: #777;
    }

    .value {
      font-weight: bold;
      text-align: right;
    }

    .certificate-button {
      display: block;
      text-align: center;
      margin-top: 20px;
      padding: 14px;
      background: #d4af37;
      color: #14213d;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">Intern<span>IO</span></div>
  <div class="tagline">INNOVATION & OPPORTUNITIES</div>
</header>

<div class="container">

  <div class="card">

    <h1>Certificate Verification</h1>

    <p style="text-align:center;">
      Verify the authenticity of an internship certificate
      issued by InternIO.
    </p>

    <input
      id="certificateId"
      placeholder="Enter Certificate ID"
    >

    <button onclick="verifyCertificate()">
      Verify Certificate
    </button>

    <div id="result" class="result"></div>

  </div>

</div>

<script>

const certificates = {

  "INIO-2026-000001": {

    certificateId: "INIO-2026-000001",

    studentName: "Test Student",

    internship: "Web Development",

    project: "E-Commerce Website",

    startDate: "01 Aug 2026",

    endDate: "08 Aug 2026",

    duration: "1 Week",

    issueDate: "10 Aug 2026",

    status: "VALID",

    certificateUrl: "https://drive.google.com/file/d/1mN5aLQk_hNu2gfxVOsNh6u1AQL2NGr9M/view?usp=sharing"
  }

};


function verifyCertificate() {

  const id =
    document
      .getElementById("certificateId")
      .value
      .trim()
      .replace(/^["']|["']$/g, "")
      .toUpperCase();

  const result =
    document.getElementById("result");


  if (!id) {

    result.innerHTML =
      '<div class="not-found">' +
      'Please enter a Certificate ID.' +
      '</div>';

    return;
  }


  const certificate =
    certificates[id];


  if (!certificate) {

    result.innerHTML =
      '<div class="not-found">' +
      '✕ Certificate Not Found' +
      '</div>';

    return;
  }


  result.innerHTML =

    '<div class="verified">' +
    '✓ CERTIFICATE VERIFIED' +
    '</div>' +

    '<div class="details">' +

    detail("Certificate ID",
           certificate.certificateId) +

    detail("Student Name",
           certificate.studentName) +

    detail("Internship",
           certificate.internship) +

    detail("Project",
           certificate.project) +

    detail("Duration",
           certificate.duration) +

    detail("Start Date",
           certificate.startDate) +

    detail("Completion Date",
           certificate.endDate) +

    detail("Issue Date",
           certificate.issueDate) +

    detail("Status",
           certificate.status) +

    '</div>' +

    '<a class="certificate-button" ' +
    'href="' +
    certificate.certificateUrl +
    '" target="_blank">' +
    'VIEW CERTIFICATE' +
    '</a>';
}


function detail(label, value) {

  return (

    '<div class="detail">' +

    '<span class="label">' +
    escapeHtml(label) +
    '</span>' +

    '<span class="value">' +
    escapeHtml(value) +
    '</span>' +

    '</div>'
  );
}


function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


window.onload = function() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  const id =
    params.get("id");


  if (id) {

    document
      .getElementById("certificateId")
      .value = id;

    verifyCertificate();

  }

};

</script>
</body>
</html>
