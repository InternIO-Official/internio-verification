<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>InternIO Certificate Verification</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #17213c;
    }

    header {
      background: #14213d;
      color: white;
      text-align: center;
      padding: 35px 20px;
    }

    .logo {
      font-size: 34px;
      font-weight: bold;
    }

    .logo span {
      color: #d4af37;
    }

    .tagline {
      margin-top: 6px;
      font-size: 14px;
      letter-spacing: 1px;
    }

    .container {
      max-width: 650px;
      margin: 50px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 5px 25px rgba(0,0,0,.08);
    }

    h1 {
      text-align: center;
    }

    p {
      color: #666;
      line-height: 1.6;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      margin-top: 20px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 6px;
      background: #14213d;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .result {
      margin-top: 30px;
    }

    .verified {
      color: #16803c;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }

    .not-found {
      color: #c62828;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    .details {
      margin-top: 25px;
      border-top: 1px solid #ddd;
    }

    .detail {
      display: flex;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid #eee;
      gap: 20px;
    }

    .label {
      color: #777;
    }

    .value {
      font-weight: bold;
      text-align: right;
    }

    .certificate-button {
      display: block;
      text-align: center;
      margin-top: 20px;
      padding: 14px;
      background: #d4af37;
      color: #14213d;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">Intern<span>IO</span></div>
  <div class="tagline">INNOVATION & OPPORTUNITIES</div>
</header>

<div class="container">

  <div class="card">

    <h1>Certificate Verification</h1>

    <p style="text-align:center;">
      Verify the authenticity of an internship certificate
      issued by InternIO.
    </p>

    <input
      id="certificateId"
      placeholder="Enter Certificate ID"
    >

    <button onclick="verifyCertificate()">
      Verify Certificate
    </button>

    <div id="result" class="result"></div>

  </div>

</div>

<script>

const API_URL = "YOUR_APPS_SCRIPT_URL";

async function verifyCertificate() {

  const id =
    document.getElementById("certificateId")
      .value
      .trim();

  const result =
    document.getElementById("result");

  if (!id) {
    result.innerHTML =
      '<div class="not-found">Enter a Certificate ID.</div>';
    return;
  }

  result.innerHTML =
    '<p style="text-align:center;">Verifying...</p>';

  /*
    We will connect this page to your
    InternIO Apps Script in the next step.
  */

}

</script>

</body>
</html>
