<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>InternIO Certificate Verification</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #17213c;
    }

    header {
      background: #14213d;
      color: white;
      text-align: center;
      padding: 35px 20px;
    }

    .logo {
      font-size: 34px;
      font-weight: bold;
    }

    .logo span {
      color: #d4af37;
    }

    .tagline {
      margin-top: 6px;
      font-size: 14px;
      letter-spacing: 1px;
    }

    .container {
      max-width: 650px;
      margin: 50px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 5px 25px rgba(0,0,0,.08);
    }

    h1 {
      text-align: center;
    }

    p {
      color: #666;
      line-height: 1.6;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      margin-top: 20px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 6px;
      background: #14213d;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .result {
      margin-top: 30px;
    }

    .verified {
      color: #16803c;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }

    .not-found {
      color: #c62828;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    .details {
      margin-top: 25px;
      border-top: 1px solid #ddd;
    }

    .detail {
      display: flex;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid #eee;
      gap: 20px;
    }

    .label {
      color: #777;
    }

    .value {
      font-weight: bold;
      text-align: right;
    }

    .certificate-button {
      display: block;
      text-align: center;
      margin-top: 20px;
      padding: 14px;
      background: #d4af37;
      color: #14213d;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">Intern<span>IO</span></div>
  <div class="tagline">INNOVATION & OPPORTUNITIES</div>
</header>

<div class="container">

  <div class="card">

    <h1>Certificate Verification</h1>

    <p style="text-align:center;">
      Verify the authenticity of an internship certificate
      issued by InternIO.
    </p>

    <input
      id="certificateId"
      placeholder="Enter Certificate ID"
    >

    <button onclick="verifyCertificate()">
      Verify Certificate
    </button>

    <div id="result" class="result"></div>

  </div>

</div>

<script>

const API_URL =
  "https://script.google.com/macros/s/AKfycbwVd3scvJ8QbbeNIrcKl3RUoFmQErWd6XHvx64ekHTuUN7sMEMgN90R8G8L7gX6kOCPhA/exec";


function verifyCertificate() {

  const id =
    document
      .getElementById("certificateId")
      .value
      .trim();


  const result =
    document.getElementById("result");


  if (!id) {

    result.innerHTML =
      '<div class="not-found">' +
      'Please enter a Certificate ID.' +
      '</div>';

    return;
  }


  result.innerHTML =
    '<p style="text-align:center;">' +
    'Verifying...' +
    '</p>';


  const callbackName =
    "internioCallback_" +
    Date.now();


  window[callbackName] =
    function(data) {

      delete window[callbackName];


      if (!data.valid) {

        result.innerHTML =
          '<div class="not-found">' +
          '✕ Certificate Not Found' +
          '</div>';

        return;
      }


      let certificateButton = "";


      if (data.certificateUrl) {

        certificateButton =

          '<a class="certificate-button" ' +
          'href="' +
          escapeHtml(data.certificateUrl) +
          '" ' +
          'target="_blank">' +
          'VIEW CERTIFICATE' +
          '</a>';
      }


      result.innerHTML =

        '<div class="verified">' +
        '✓ CERTIFICATE VERIFIED' +
        '</div>' +

        '<div class="details">' +

        detail(
          "Certificate ID",
          data.certificateId
        ) +

        detail(
          "Student Name",
          data.studentName
        ) +

        detail(
          "Internship",
          data.internship
        ) +

        detail(
          "Project",
          data.project
        ) +

        detail(
          "Duration",
          data.duration
        ) +

        detail(
          "Start Date",
          data.startDate
        ) +

        detail(
          "Completion Date",
          data.endDate
        ) +

        detail(
          "Issue Date",
          data.issueDate
        ) +

        detail(
          "Status",
          data.status,
          true
        ) +

        '</div>' +

        certificateButton;
    };


  const script =
    document.createElement("script");


  script.src =
    API_URL +
    "?api=1" +
    "&id=" +
    encodeURIComponent(id) +
    "&callback=" +
    callbackName;


  script.onerror = function() {

    delete window[callbackName];

    result.innerHTML =
      '<div class="not-found">' +
      'Unable to connect to InternIO verification server.' +
      '</div>';
  };


  document.body.appendChild(script);
}


function detail(label, value, status) {

  return (

    '<div class="detail">' +

    '<span class="label">' +
    escapeHtml(valueLabel(label)) +
    '</span>' +

    '<span class="value' +
    (status ? ' status' : '') +
    '">' +

    escapeHtml(value || "") +

    '</span>' +

    '</div>'
  );
}


function valueLabel(value) {
  return value;
}


function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* Automatic verification when URL contains ?id= */

window.onload = function() {

  const params =
    new URLSearchParams(
      window.location.search
    );


  const id =
    params.get("id");


  if (id) {

    document
      .getElementById("certificateId")
      .value = id;

    verifyCertificate();
  }
};

</script>

</body>
</html>
