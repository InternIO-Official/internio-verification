<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>InternIO Certificate Verification</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #17213c;
    }

    header {
      background: #14213d;
      color: white;
      text-align: center;
      padding: 38px 20px;
    }

    .logo {
      font-size: 36px;
      font-weight: 700;
    }

    .logo span {
      color: #d4af37;
    }

    .tagline {
      margin-top: 8px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 1.5px;
    }

    .container {
      width: 100%;
      max-width: 700px;
      margin: 55px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      text-align: center;
      margin-top: 0;
      margin-bottom: 15px;
      font-size: 32px;
    }

    .description {
      text-align: center;
      color: #666;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #14213d;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: none;
      border-radius: 7px;
      background: #14213d;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #1d2d50;
    }

    .result {
      margin-top: 30px;
    }

    .verified {
      text-align: center;
      color: #16803c;
      font-size: 23px;
      font-weight: 700;
      margin-bottom: 25px;
    }

    .not-found {
      text-align: center;
      color: #c62828;
      font-size: 20px;
      font-weight: 700;
      padding: 20px;
    }

    .error {
      text-align: center;
      color: #c62828;
      padding: 20px;
      line-height: 1.5;
    }

    .details {
      border-top: 1px solid #e5e7eb;
      margin-top: 10px;
    }

    .detail {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 15px 0;
      border-bottom: 1px solid #eeeeee;
    }

    .label {
      color: #777;
      font-weight: 500;
    }

    .value {
      color: #17213c;
      font-weight: 600;
      text-align: right;
    }

    .valid {
      color: #16803c;
    }

    .certificate-button {
      display: block;
      width: 100%;
      text-align: center;
      margin-top: 25px;
      padding: 15px;
      background: #d4af37;
      color: #14213d;
      text-decoration: none;
      border-radius: 7px;
      font-weight: 700;
    }

    .certificate-button:hover {
      background: #c49f2f;
    }

    footer {
      text-align: center;
      color: #777;
      font-size: 13px;
      padding: 20px;
      margin-bottom: 20px;
    }

    @media (max-width: 600px) {

      header {
        padding: 30px 15px;
      }

      .logo {
        font-size: 30px;
      }

      .container {
        margin: 25px auto;
        padding: 15px;
      }

      .card {
        padding: 25px 20px;
      }

      h1 {
        font-size: 27px;
      }

      .detail {
        flex-direction: column;
        gap: 5px;
      }

      .value {
        text-align: left;
      }
    }
  </style>

</head>


<body>


<header>

  <div class="logo">
    Intern<span>IO</span>
  </div>

  <div class="tagline">
    INNOVATION &amp; OPPORTUNITIES
  </div>

</header>


<div class="container">

  <div class="card">

    <h1>
      Certificate Verification
    </h1>

    <p class="description">
      Verify the authenticity of an internship
      certificate issued by InternIO.
    </p>


    <input
      id="certificateId"
      type="text"
      placeholder="Enter Certificate ID"
      autocomplete="off"
    >


    <button onclick="verifyCertificate()">
      Verify Certificate
    </button>


    <div
      id="result"
      class="result"
    ></div>

  </div>

</div>


<footer>
  © 2026 InternIO — Innovation &amp; Opportunities
</footer>



<script>


/*
=====================================================
SUPABASE CONNECTION
=====================================================
*/

const SUPABASE_URL =
  "https://hgodypvijzrvnsfylwdu.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_4oTVR9f73fDNrMFXyxl2IA_A7As8VMv";


/*
=====================================================
VERIFY CERTIFICATE
=====================================================
*/

async function verifyCertificate() {

  const input =
    document.getElementById(
      "certificateId"
    );


  const result =
    document.getElementById(
      "result"
    );


  const id =
    input.value
      .trim()
      .replace(/^["']|["']$/g, "")
      .toUpperCase();


  if (!id) {

    result.innerHTML = `

      <div class="not-found">

        Please enter a Certificate ID.

      </div>

    `;

    return;
  }


  result.innerHTML = `

    <p style="text-align:center;">

      Verifying certificate...

    </p>

  `;


  try {

    /*
    Send ONLY the requested certificate ID
    to the secure Supabase function.
    */

    const response = await fetch(

      SUPABASE_URL +
      "/rest/v1/rpc/verify_certificate",

      {

        method: "POST",

        headers: {

          "Content-Type":
            "application/json",

          "apikey":
            SUPABASE_KEY,

          "Authorization":
            "Bearer " + SUPABASE_KEY

        },

        body: JSON.stringify({

          lookup_id: id

        })

      }

    );


    if (!response.ok) {

      throw new Error(
        "Supabase request failed: " +
        response.status
      );

    }


    const data =
      await response.json();


    /*
    No matching certificate
    */

    if (
      !data ||
      data.length === 0
    ) {

      result.innerHTML = `

        <div class="not-found">

          ✕ Certificate Not Found

        </div>

      `;

      return;

    }


    /*
    Certificate found
    */

    const certificate =
      data[0];


    displayCertificate(
      certificate,
      result
    );


  }

  catch (error) {

    console.error(
      "Verification error:",
      error
    );


    result.innerHTML = `

      <div class="error">

        <strong>
          Unable to verify certificate.
        </strong>

        <br><br>

        Please try again later.

      </div>

    `;

  }

}



/*
=====================================================
DISPLAY CERTIFICATE
=====================================================
*/

function displayCertificate(
  certificate,
  result
) {


  let certificateButton = "";


  if (
    certificate.certificate_url
  ) {

    certificateButton = `

      <a
        class="certificate-button"
        href="${escapeHTML(
          certificate.certificate_url
        )}"
        target="_blank"
        rel="noopener noreferrer"
      >

        VIEW CERTIFICATE

      </a>

    `;

  }


  result.innerHTML = `


    <div class="verified">

      ✓ CERTIFICATE VERIFIED

    </div>


    <div class="details">


      <div class="detail">

        <span class="label">
          Certificate ID
        </span>

        <span class="value">

          ${escapeHTML(
            certificate.certificate_id
          )}

        </span>

      </div>


      <div class="detail">

        <span class="label">
          Student Name
        </span>

        <span class="value">

          ${escapeHTML(
            certificate.student_name
          )}

        </span>

      </div>


      <div class="detail">

        <span class="label">
          Internship
        </span>

        <span class="value">

          ${escapeHTML(
            certificate.internship
          )}

        </span>

      </div>


      <div class="detail">

        <span class="label">
          Project
        </span>

        <span class="value">

          ${escapeHTML(
            certificate.project || ""
          )}

        </span>

      </div>


      <div class="detail">

        <span class="label">
          Start Date
        </span>

        <span class="value">

          ${escapeHTML(
            certificate.start_date || ""
          )}

        </span>

      </div>


      <div class="detail">

        <span class="label">
          End Date
        </span>

        <span class="value">

          ${escapeHTML(
            certificate.end_date || ""
          )}

        </span>

      </div>


      <div class="detail">

        <span class="label">
          Duration
        </span>

        <span class="value">

          ${escapeHTML(
            certificate.duration || ""
          )}

        </span>

      </div>


      <div class="detail">

        <span class="label">
          Issue Date
        </span>

        <span class="value">

          ${escapeHTML(
            certificate.issue_date || ""
          )}

        </span>

      </div>


      <div class="detail">

        <span class="label">
          Status
        </span>

        <span class="value valid">

          ✓ ${escapeHTML(
            certificate.status
          )}

        </span>

      </div>


    </div>


    ${certificateButton}


  `;

}



/*
=====================================================
ESCAPE HTML
=====================================================
*/

function escapeHTML(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}



/*
=====================================================
AUTOMATIC QR VERIFICATION

Example:

?id=INIO-2026-000001
=====================================================
*/

window.onload = function() {


  const params =
    new URLSearchParams(
      window.location.search
    );


  const id =
    params.get("id");


  if (id) {

    document
      .getElementById(
        "certificateId"
      )
      .value = id;


    verifyCertificate();

  }

};


</script>


</body>

</html>
