<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>InternIO QR Generator</title>


  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #17213c;
    }

    header {
      background: #14213d;
      color: white;
      text-align: center;
      padding: 35px 20px;
    }

    .logo {
      font-size: 34px;
      font-weight: 700;
    }

    .logo span {
      color: #d4af37;
    }

    .tagline {
      margin-top: 8px;
      font-size: 13px;
      letter-spacing: 1.5px;
    }

    .container {
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 35px;
      border-radius: 14px;
      box-shadow:
        0 8px 30px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-top: 0;
    }

    .description {
      text-align: center;
      color: #666;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #14213d;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border: none;
      border-radius: 7px;
      background: #14213d;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #1d2d50;
    }

    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .qr-area {
      display: none;
      text-align: center;
      margin-top: 35px;
    }

    .qr-area img {
      width: 280px;
      height: 280px;
      max-width: 100%;
      border: 10px solid white;
    }

    .certificate-id {
      margin-top: 20px;
      font-size: 18px;
      font-weight: 700;
    }

    .verification-url {
      margin-top: 10px;
      font-size: 12px;
      color: #777;
      word-break: break-all;
    }

    .download-button {
      display: block;
      width: 100%;
      padding: 15px;
      margin-top: 20px;
      background: #d4af37;
      color: #14213d;
      border: none;
      border-radius: 7px;
      font-weight: 700;
      cursor: pointer;
      font-size: 16px;
    }

    .error {
      color: #c62828;
      text-align: center;
      margin-top: 20px;
      font-weight: 600;
      line-height: 1.5;
    }

    .success {
      color: #16803c;
      text-align: center;
      margin-top: 20px;
      font-weight: 600;
    }

    .checking {
      color: #555;
      text-align: center;
      margin-top: 20px;
    }

    footer {
      text-align: center;
      color: #777;
      font-size: 13px;
      padding: 20px;
    }

  </style>

</head>


<body>


<header>

  <div class="logo">
    Intern<span>IO</span>
  </div>

  <div class="tagline">
    INNOVATION &amp; OPPORTUNITIES
  </div>

</header>



<div class="container">

  <div class="card">

    <h1>
      QR Code Generator
    </h1>

    <p class="description">

      Generate a QR code only for a valid
      InternIO certificate.

    </p>


    <label for="certificateId">
      Certificate ID
    </label>


    <input
      id="certificateId"
      type="text"
      placeholder="INIO-2026-000001"
      autocomplete="off"
    >


    <button
      id="generateButton"
      onclick="generateQR()"
    >
      Verify &amp; Generate QR
    </button>


    <div
      id="message"
    ></div>


    <div
      id="qrArea"
      class="qr-area"
    >

      <img
        id="qrImage"
        alt="InternIO Certificate QR Code"
      >


      <div
        id="certificateIdDisplay"
        class="certificate-id"
      ></div>


      <div
        id="verificationUrl"
        class="verification-url"
      ></div>


      <button
        class="download-button"
        onclick="downloadQR()"
      >
        Download QR Code
      </button>

    </div>

  </div>

</div>



<footer>

  © 2026 InternIO — Innovation &amp; Opportunities

</footer>



<script>


/*
=====================================================
SUPABASE
=====================================================
*/

const SUPABASE_URL =
  "https://hgodypvijzrvnsfylwdu.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_4oTVR9f73fDNrMFXyxl2IA_A7As8VMv";


/*
=====================================================
INTERNIO VERIFICATION WEBSITE
=====================================================
*/

const VERIFICATION_URL =
  "https://ajaybilonia.github.io/internio-verification/";



/*
=====================================================
GENERATE QR
=====================================================
*/

async function generateQR() {


  const input =
    document.getElementById(
      "certificateId"
    );


  const message =
    document.getElementById(
      "message"
    );


  const qrArea =
    document.getElementById(
      "qrArea"
    );


  const button =
    document.getElementById(
      "generateButton"
    );


  const id =
    input.value
      .trim()
      .replace(/^["']|["']$/g, "")
      .toUpperCase();


  /*
  Reset
  */

  qrArea.style.display =
    "none";

  message.className =
    "";

  message.innerHTML =
    "";


  /*
  Empty ID
  */

  if (!id) {

    message.className =
      "error";

    message.textContent =
      "Please enter a Certificate ID.";

    return;

  }


  /*
  Disable button
  */

  button.disabled =
    true;

  button.textContent =
    "Checking certificate...";


  message.className =
    "checking";

  message.textContent =
    "Checking InternIO certificate database...";


  try {


    /*
    Check certificate through
    the secure Supabase function.
    */

    const response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/rpc/verify_certificate",

        {

          method: "POST",

          headers: {

            "Content-Type":
              "application/json",

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_KEY

          },

          body: JSON.stringify({

            lookup_id: id

          })

        }

      );


    /*
    Supabase error
    */

    if (!response.ok) {

      throw new Error(
        "Database error: " +
        response.status
      );

    }


    const data =
      await response.json();


    /*
    Certificate doesn't exist
    */

    if (
      !data ||
      data.length === 0
    ) {

      message.className =
        "error";

      message.innerHTML = `
        ✕ Certificate Not Found
        <br>
        <small>
          No InternIO certificate exists
          with ID ${escapeHTML(id)}.
        </small>
      `;

      return;

    }


    /*
    Certificate exists
    */

    const certificate =
      data[0];


    /*
    Check certificate status
    */

    if (
      String(
        certificate.status
      ).toUpperCase() !==
      "VALID"
    ) {

      message.className =
        "error";

      message.innerHTML = `
        ✕ Certificate Is Not Valid
        <br>
        <small>
          Status:
          ${escapeHTML(
            certificate.status
          )}
        </small>
      `;

      return;

    }


    /*
    Create verification URL
    */

    const verificationUrl =
      VERIFICATION_URL +
      "?id=" +
      encodeURIComponent(
        certificate.certificate_id
      );


    /*
    Create QR
    */

    const qrUrl =
      "https://api.qrserver.com/v1/create-qr-code/" +
      "?size=600x600" +
      "&data=" +
      encodeURIComponent(
        verificationUrl
      );


    /*
    Display QR
    */

    document.getElementById(
      "qrImage"
    ).src = qrUrl;


    document.getElementById(
      "certificateIdDisplay"
    ).textContent =
      certificate.certificate_id;


    document.getElementById(
      "verificationUrl"
    ).textContent =
      verificationUrl;


    qrArea.style.display =
      "block";


    message.className =
      "success";

    message.innerHTML =
      "✓ Certificate verified. QR generated.";


  }


  catch (error) {

    console.error(error);


    message.className =
      "error";

    message.innerHTML = `
      Unable to check the certificate.
      <br><br>
      Please try again.
    `;

  }


  finally {

    button.disabled =
      false;

    button.textContent =
      "Verify & Generate QR";

  }

}



/*
=====================================================
DOWNLOAD QR
=====================================================
*/

async function downloadQR() {


  const img =
    document.getElementById(
      "qrImage"
    );


  const id =
    document.getElementById(
      "certificateIdDisplay"
    )
    .textContent
    .trim();


  if (!img.src) {

    return;

  }


  try {


    const response =
      await fetch(
        img.src
      );


    const blob =
      await response.blob();


    const url =
      URL.createObjectURL(
        blob
      );


    const link =
      document.createElement(
        "a"
      );


    link.href =
      url;


    link.download =
      "InternIO-" +
      id +
      "-QR.png";


    document.body.appendChild(
      link
    );


    link.click();


    document.body.removeChild(
      link
    );


    URL.revokeObjectURL(
      url
    );


  }


  catch (error) {

    window.open(
      img.src,
      "_blank"
    );

  }

}



/*
=====================================================
ESCAPE HTML
=====================================================
*/

function escapeHTML(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

</script>


</body>

</html>
